name: Memory investigation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'vendor/**', '.github/workflows/investigate.yml', 'package*.json']
permissions:
  contents: read
concurrency:
  group: investigation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        experiment: [matched, minified, workers]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl xz-utils xvfb xauth xdotool xclip openbox imagemagick mesa-utils mesa-vulkan-drivers libvulkan1 libasound2t64 libgtk-3-0 libnss3 libgbm1 libxss1 libxtst6
      - run: python3 vendor/benchmark/scripts/install.py --editors lvce
      - run: node scripts/prepare-experiment.js '${{ matrix.experiment }}'
      - name: Three fresh trials per app, shuffled on the same host
        env:
          BENCHMARK_COMMIT: ${{ github.sha }}
          BENCHMARK_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash vendor/benchmark/scripts/run.sh --editors lvce,basic-electron --repeats 3 --budgets '' --refinement-iterations 0 --output "$PWD/results/${{ matrix.experiment }}.json"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: investigation-${{ matrix.experiment }}
          path: results/
          if-no-files-found: error
          retention-days: 90
