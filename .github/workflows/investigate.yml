name: Production patch experiments
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: patches-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        experiment: [shared-in-main, services-in-main, renderer-chunks, lazy-git, rollup-terser]
    env:
      BENCHMARK_COMMIT: ${{ github.sha }}
      BENCHMARK_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl xz-utils xvfb xauth xdotool xclip openbox imagemagick mesa-utils mesa-vulkan-drivers libvulkan1 libasound2t64 libgtk-3-0 libnss3 libgbm1 libxss1 libxtst6
      - run: python3 vendor/benchmark/scripts/install.py --editors lvce
      - run: node scripts/prepare-experiment.js matched
      - name: Same-host unmodified control
        run: bash vendor/benchmark/scripts/run.sh --editors lvce,basic-electron --repeats 3 --budgets '' --refinement-iterations 0 --output "$PWD/results/${{ matrix.experiment }}-control.json"
      - run: node scripts/patch-app.js '${{ matrix.experiment }}'
      - name: Patched application and untouched minimal Electron
        run: bash vendor/benchmark/scripts/run.sh --editors lvce,basic-electron --repeats 3 --budgets '' --refinement-iterations 0 --output "$PWD/results/${{ matrix.experiment }}.json"
      - name: Git repository positive control
        if: matrix.experiment == 'lazy-git'
        run: bash vendor/benchmark/scripts/run.sh --editors lvce --workspace-kind git --repeats 3 --budgets '' --refinement-iterations 0 --output "$PWD/results/lazy-git-repository.json"
      - name: Separate architecture diagnostic
        run: |
          node scripts/enable-diagnostics.js
          bash vendor/benchmark/scripts/run.sh --editors lvce --repeats 1 --budgets '' --refinement-iterations 0 --sample-seconds 15 --output "$PWD/results/${{ matrix.experiment }}-diagnostic.json"
      - name: Git activation diagnostic in a repository
        if: matrix.experiment == 'lazy-git'
        run: bash vendor/benchmark/scripts/run.sh --editors lvce --workspace-kind git --repeats 1 --budgets '' --refinement-iterations 0 --sample-seconds 15 --output "$PWD/results/lazy-git-repository-diagnostic.json"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: patches-${{ matrix.experiment }}
          path: results/
          if-no-files-found: error
          retention-days: 90
